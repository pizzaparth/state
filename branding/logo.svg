<svg xmlns="http://www.w3.org/2000/svg" viewBox="-627 -627 1254 1254" fill="none" color="#FFFFFF">
  <title>State</title>
  <rect x="-627" y="-627" width="1254" height="1254" fill="#000000"/>
  <!-- Vectorised from branding/logo.png (1254px raster, centre 625.5,602). Units are source px. -->
  <defs>
    <mask id="state-crosshair" maskUnits="userSpaceOnUse" x="-340" y="-340" width="680" height="680">
      <rect x="-340" y="-340" width="680" height="680" fill="#fff"/>
      <rect x="-12.5" y="-340" width="25" height="680" fill="#000"/>
      <rect x="-340" y="-12.5" width="680" height="25" fill="#000"/>
    </mask>
  </defs>
  <g stroke="currentColor" mask="url(#state-crosshair)">
    <circle r="323" stroke-width="16"/>
    <circle r="242.5" stroke-width="14"/>
  </g>
  <circle r="111" stroke="currentColor" stroke-width="123"/>
</svg>
