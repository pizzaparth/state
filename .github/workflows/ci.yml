name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository, packages or deployments
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: state
          POSTGRES_PASSWORD: state
          POSTGRES_DB: state_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U state" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database and throwaway secret; no production credentials in CI
      DATABASE_URL: postgresql://state:state@localhost:5432/state_ci_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3123
      NEXT_PUBLIC_APP_URL: http://localhost:3123
      # Emails land here as JSON so the suite can follow verification and reset links
      EMAIL_OUTBOX_DIR: /tmp/state-email-outbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # No install scripts: dependencies cannot run code on the runner
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npx tsx scripts/seed.ts
      - run: npm run authz:check
      - run: npm run build
      - name: Black-box security suite
        run: |
          npx next start -p 3123 &
          for i in $(seq 1 30); do curl -sf localhost:3123/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3123 npm run security:check
      - name: End-to-end path (desktop and phone)
        run: |
          npx playwright install --with-deps chromium
          npx next start -p 3123 &
          for i in $(seq 1 30); do curl -sf localhost:3123/api/health && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3123 E2E_CHANNEL=bundled npm run e2e
