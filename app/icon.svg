<svg xmlns="http://www.w3.org/2000/svg" viewBox="-400 -400 800 800" fill="none" color="#F4F4F2">
  <rect x="-400" y="-400" width="800" height="800" rx="160" fill="#050505"/>
  <mask id="m" maskUnits="userSpaceOnUse" x="-340" y="-340" width="680" height="680">
    <rect x="-340" y="-340" width="680" height="680" fill="#fff"/>
    <rect x="-16" y="-340" width="32" height="680" fill="#000"/>
    <rect x="-340" y="-16" width="680" height="32" fill="#000"/>
  </mask>
  <!-- Strokes thickened for legibility at 16–32px -->
  <g stroke="currentColor" mask="url(#m)">
    <circle r="318" stroke-width="28"/>
    <circle r="236" stroke-width="26"/>
  </g>
  <circle r="111" stroke="currentColor" stroke-width="123"/>
</svg>
